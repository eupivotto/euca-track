[project]
name = "rota-da-madeira-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0,<3",
  "geoalchemy2>=0.15",
  "shapely>=2.0",
  "pyproj>=3.6",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
