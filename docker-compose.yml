services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: rota
      POSTGRES_PASSWORD: rota
      POSTGRES_DB: rota
    volumes:
      - dados_db:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rota -d rota"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Roda uma vez a cada subida: migrações, seed e rotas que faltarem (todos idempotentes).
  preparo:
    build: ./api
    command: sh -c "alembic upgrade head && python -m app.seed && python -m app.scripts.gerar_rotas --faltantes"
    environment:
      DATABASE_URL: postgresql+psycopg://rota:rota@db:5432/rota
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://rota:rota@db:5432/rota
      TOKEN_TELEMETRIA: dev-token
      # Para demonstrar alertas sem esperar: PROB_EVENTO_VIAGEM=1 docker compose up -d
      PROB_EVENTO_VIAGEM: ${PROB_EVENTO_VIAGEM:-0.05}
    volumes:
      - ./api:/app
      - fotos:/dados/fotos
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      preparo:
        condition: service_completed_successfully

  simulator:
    build: ./simulator
    command: python -m sim
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
      TOKEN_TELEMETRIA: dev-token
    volumes:
      - ./simulator:/app
    depends_on:
      - api

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
      - web

volumes:
  dados_db:
  fotos:
