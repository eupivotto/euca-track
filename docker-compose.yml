services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: rota
      POSTGRES_PASSWORD: rota
      POSTGRES_DB: rota
    volumes:
      - dados_db:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rota -d rota"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://rota:rota@db:5432/rota
      TOKEN_TELEMETRIA: dev-token
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  simulator:
    build: ./simulator
    command: python -m sim
    environment:
      API_URL: http://api:8000
      TOKEN_TELEMETRIA: dev-token
    volumes:
      - ./simulator:/app
    depends_on:
      - api

  web:
    build: ./web
    ports:
      - "3000:3000"
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
      - web

volumes:
  dados_db:
